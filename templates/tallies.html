<!doctype html><link rel=stylesheet href=/static/style.css><meta name=viewport content='width=device-width,initial-scale=1'>
<header><b>Simulated Tally Dashboard</b><a href=/>Training ballot</a></header>
<div class=demo>TRAINING / SIMULATION ONLY — these are demo counts.</div>
<div class=wrap>
{% for s in sections %}
<div class=card>
 <h2>{{s.title}}</h2>
 <table>
  <tr><th>Rank</th><th>Candidate</th><th>Votes</th></tr>
  {% for c in s.candidates %}
  <tr>
   <td><b>#{{c.rank}}</b></td>
   <td>{{c.name}}</td>
   <td><b>{{c.votes}}</b></td>
  </tr>
  {% endfor %}
 </table>
</div>
{% endfor %}
<div class=card>
 <form method=post action=/reset-demo>
  <button>Reset all simulated votes</button>
 </form>
</div>
</div>
