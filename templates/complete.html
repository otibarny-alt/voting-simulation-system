<!doctype html><link rel=stylesheet href=/static/style.css><meta name=viewport content='width=device-width,initial-scale=1'><header><b>Training ballot complete</b>{% if stream_row and stream_row["closed_at"] %}
<a href=/tallies>Simulated Tallies</a>
{% else %}
<span class="header-tally-locked">Simulated Tallies Locked</span>
{% endif %}</header><div class=demo>TRAINING / SIMULATION ONLY — no official vote was cast.</div><div class=wrap>
<div class="odm-screen-header project-screen-brand">
 <img src="/static/odm_screen_header.png" alt="Orange Democratic Movement" class="odm-screen-header-image">
</div>
<div class=card><h2>Six simulated selections saved</h2><p>{{geo.poll_station}} · {{geo.stream}}</p>
 <div class="complete-next-voter-row">
  <a id="complete-next-voter" class="complete-next-voter-btn" href="/">Next Voter</a>
 </div>
</div></div>
<script>
document.getElementById('complete-next-voter').addEventListener('click',function(){
 this.classList.add('is-selected');
 this.textContent='Opening Next Voter…';
});
</script>
