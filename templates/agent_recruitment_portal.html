<!doctype html>
<html lang="en"><head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <title>ODM Agent Recruitment</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}">
 <style>.agent-wrap{max-width:680px;margin:42px auto;padding:0 18px}.agent-card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:30px}.agent-card label{display:block;font-weight:800;margin:18px 0 7px}.agent-card input{box-sizing:border-box;width:100%}.agent-card button{margin-top:20px;background:#ef7d00;color:#111;font-weight:850}.agent-note{background:#fff4d6;border:1px solid #e3ad35;border-radius:9px;padding:13px;margin:18px 0}.agent-error{background:#fdecec;border:1px solid #c52b37;padding:12px;border-radius:8px;color:#8b1520;font-weight:700}</style>
</head><body>
<header><b>ODM Agent Recruitment Portal</b><a href="{{ url_for('membership_portal') }}">Membership Registration</a></header>
<main class="agent-wrap"><section class="agent-card">
 <h1>Agent Sign-up</h1>
 <p>Enter your National ID.</p>
 <div class="agent-note"><b>Eligibility:</b> Only a National ID found in Membership Registration can proceed. One agent application is permitted per National ID.</div>
 {% if error %}<div class="agent-error">{{error}}</div>{% endif %}
 <form method="post">
  <label for="national_id">National ID number</label>
  <input id="national_id" name="national_id" inputmode="numeric" autocomplete="off" maxlength="8" required autofocus>
  <button type="submit">Verify Membership and Continue</button>
 </form>
</section></main></body></html>
