<!doctype html><link rel=stylesheet href=/static/style.css><meta name=viewport content='width=device-width,initial-scale=1'><header><b>{{e.title}} — Training Ballot</b><span>Ballot {{step+1}} of {{total}}</span></header><div class=demo>TRAINING / SIMULATION ONLY — not an official ballot.</div><div class=wrap><div class=card><h2>Select one {{e.title}} candidate</h2>{% if error %}<p>{{error}}</p>{% endif %}<form method=post><div class=grid>{% for c in e.candidates %}<div class=candidate><input id=c{{c.slot}} type=radio name=candidate value={{c.slot}} {% if selected==c.slot %}checked{% endif %}><label for=c{{c.slot}}><div class=photo>{{c.slot}}</div><b>{{c.name}}</b></label></div>{% endfor %}</div><div class=actions>{% if step>0 %}<a class='btn secondary' href='/ballot/{{step-1}}'>Back</a>{% else %}<span></span>{% endif %}<button>Save choice & continue</button></div></form></div></div>
